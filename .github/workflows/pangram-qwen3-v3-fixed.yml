name: Temporary EditLens Qwen3-4B v3 2026 check fixed

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  editlens_v3_fixed:
    if: ${{ github.head_ref == 'chatgpt-pangram-llama3-check-20260822' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .pangram-qwen3-key
          key: pangram-qwen3-ephemeral-v1-${{ github.head_ref }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: editlens-qwen3-4b-v3-2026-public-v2
          save-always: true
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost || true
          sudo apt-get clean || true
          python -m pip install --no-cache-dir -q 'transformers>=4.51,<5' accelerate safetensors scipy emoji huggingface_hub protobuf
      - name: Decrypt essays only inside runner
        shell: bash
        run: |
          set -euo pipefail
          base64 -d pangram_qwen3_payload/key.enc.b64 > "$RUNNER_TEMP/key.enc"
          openssl pkeyutl -decrypt -inkey .pangram-qwen3-key/private.pem -in "$RUNNER_TEMP/key.enc" -out "$RUNNER_TEMP/key.hex"
          for s in essay1 essay2; do
            cat pangram_qwen3_payload/${s}.enc.b64.part* > "$RUNNER_TEMP/${s}.enc.b64"
            base64 -d "$RUNNER_TEMP/${s}.enc.b64" > "$RUNNER_TEMP/${s}.enc"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$RUNNER_TEMP/key.hex" -in "$RUNNER_TEMP/${s}.enc" -out "$RUNNER_TEMP/${s}.txt.gz"
            gzip -dc "$RUNNER_TEMP/${s}.txt.gz" > "$RUNNER_TEMP/${s}.txt"
            chmod 600 "$RUNNER_TEMP/${s}.txt"
          done
      - name: Score controls and both essays
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/v3_fixed.py" <<'PY'
          import json, os, re, statistics
          from pathlib import Path
          import torch, torch.nn as nn, emoji
          from transformers import AutoModelForSequenceClassification, AutoTokenizer
          from huggingface_hub import hf_hub_download
          from safetensors import safe_open

          MODEL='DarrenJiaImbue/editlens-qwen3-4b-merged-v3'
          TOKENIZER='Qwen/Qwen3-4B'
          MAXLEN=1024; CW=450; OV=50; MINW=75
          names=['Human','Light AI edit','Heavy AI edit','AI generated']

          class NormedLinear(nn.Module):
              def __init__(self,h,n,device=None,dtype=None):
                  super().__init__(); self.norm=nn.LayerNorm(h,device=device,dtype=dtype); self.linear=nn.Linear(h,n,bias=False,device=device,dtype=dtype)
              def forward(self,x): return self.linear(self.norm(x))

          def clean(t):
              t=emoji.demojize(t)
              if '</think>' in t: t=t.split('</think>',1)[1].strip()
              ps=[p for p in t.split('\n') if p.strip()]
              if ps:
                  first=emoji.replace_emoji(re.sub(r'^[^a-zA-Z0-9]*','',ps[0]),'')
                  if any(first.startswith(x) for x in ['Sure','Here','Abstract','Title',"I'm happy to help",'Certainly']) and len(ps)>1: t='\n'.join(ps[1:])
              return re.sub(r'\s+',' ',t.lower()).strip()

          print('V3_MODEL',MODEL,flush=True)
          tok=AutoTokenizer.from_pretrained(TOKENIZER)
          if tok.pad_token is None: tok.pad_token=tok.eos_token
          tok.padding_side='left'
          print('Loading merged 2026-vintage model...',flush=True)
          m=AutoModelForSequenceClassification.from_pretrained(MODEL,dtype=torch.bfloat16,low_cpu_mem_usage=True,attn_implementation='eager')
          dev=next(m.parameters()).device; dt=next(m.parameters()).dtype
          m.score=NormedLinear(m.config.hidden_size,m.config.num_labels,device=dev,dtype=dt)
          sf=hf_hub_download(MODEL,'model.safetensors')
          with safe_open(sf,framework='pt') as f:
              m.score.norm.weight.data.copy_(f.get_tensor('score.norm.weight').to(dtype=dt))
              m.score.norm.bias.data.copy_(f.get_tensor('score.norm.bias').to(dtype=dt))
              m.score.linear.weight.data.copy_(f.get_tensor('score.linear.weight').to(dtype=dt))
          m.config.pad_token_id=tok.pad_token_id; m.eval(); torch.set_num_threads(max(1,min(4,os.cpu_count() or 1)))

          calibration=None
          try: calibration=json.loads(Path(hf_hub_download(MODEL,'calibration.json')).read_text())
          except Exception as e: calibration={'unavailable':type(e).__name__}

          def one(t):
              e=tok(clean(t),return_tensors='pt',truncation=True,max_length=MAXLEN)
              with torch.inference_mode(): p=torch.softmax(m(**e).logits[0].float(),-1).cpu().tolist()
              b=max(range(4),key=lambda i:p[i]); sc=sum(i*p[i] for i in range(4))/3
              return {'score':sc,'bucket':b,'bucket_name':names[b],'probs':p,'tokens':int(e.input_ids.shape[1])}

          controls={
            'gettysburg':'Four score and seven years ago our fathers brought forth on this continent, a new nation, conceived in Liberty, and dedicated to the proposition that all men are created equal. Now we are engaged in a great civil war, testing whether that nation, or any nation so conceived and so dedicated, can long endure. We are met on a great battle-field of that war. We have come to dedicate a portion of that field, as a final resting place for those who here gave their lives that that nation might live. It is altogether fitting and proper that we should do this. But, in a larger sense, we can not dedicate—we can not consecrate—we can not hallow—this ground. The brave men, living and dead, who struggled here, have consecrated it, far above our poor power to add or detract.',
            'ai_style':'Artificial intelligence is transforming the way organizations approach decision-making, collaboration, and long-term planning. At its core, the technology enables teams to process large amounts of information, identify meaningful patterns, and generate useful recommendations in less time. However, successful adoption requires more than simply deploying a powerful model. Organizations must also establish clear goals, define appropriate safeguards, and create processes for human review. A thoughtful implementation begins by identifying tasks where automation can provide measurable value while preserving accountability for consequential decisions. Teams should evaluate model outputs against relevant benchmarks, document known limitations, and monitor performance over time. They should also consider how users will interact with the system, because interface design can strongly influence whether recommendations are understood as suggestions or treated as authoritative conclusions.'}
          print('---V3FIX-CONTROLS-BEGIN---')
          for k,v in controls.items(): print(json.dumps({'name':k,**one(v)}),flush=True)
          print('---V3FIX-CONTROLS-END---')

          def doc(fn,label):
              t=clean(Path(os.environ['RUNNER_TEMP'],fn).read_text()); ws=t.split(); rows=[]
              for start in range(0,len(ws),CW-OV):
                  end=min(len(ws),start+CW)
                  if end-start<MINW: break
                  r=one(' '.join(ws[start:end])); r.update(chunk=len(rows)+1,start_word=start+1,end_word=end); rows.append(r)
                  print(f'V3FIX {label} chunk {len(rows)} score={r["score"]:.6f} bucket={r["bucket"]}',flush=True)
                  if end==len(ws): break
              weights=[r['end_word']-r['start_word']+1 for r in rows]; vals=[r['score'] for r in rows]; total=sum(weights)
              return {'label':label,'words':len(ws),'chunks':len(rows),'weighted_mean_score':sum(r['score']*w for r,w in zip(rows,weights))/total,'median_score':statistics.median(vals),'min_score':min(vals),'max_score':max(vals),'bucket_counts':{n:sum(r['bucket_name']==n for r in rows) for n in names},'rows':rows}

          out={'model':MODEL,'training_vintage':'2026 Sonnet 4.6 + GPT-5.3 + Gemini-3-Flash reproduction','calibration':calibration,'documents':[doc('essay1.txt','closed_tribunal'),doc('essay2.txt','liberal_defence_markets')]}
          print('---EDITLENS-V3FIX-RESULT-BEGIN---'); print(json.dumps(out,indent=2)); print('---EDITLENS-V3FIX-RESULT-END---')
          PY
          python "$RUNNER_TEMP/v3_fixed.py"
      - name: Wipe plaintext
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/essay1* "$RUNNER_TEMP"/essay2* "$RUNNER_TEMP"/key.* "$RUNNER_TEMP"/v3_fixed.py || true
