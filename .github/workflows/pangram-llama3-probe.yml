name: Temporary EditLens Qwen3-4B strong check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  editlens:
    if: ${{ github.head_ref == 'chatgpt-pangram-llama3-check-20260822' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore ephemeral encryption key
        uses: actions/cache@v4
        with:
          path: .pangram-qwen3-key
          key: pangram-qwen3-ephemeral-v1-${{ github.head_ref }}

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: editlens-qwen3-4b-public-v1

      - name: Generate or recover encryption keypair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pangram-qwen3-key
          if [ ! -s .pangram-qwen3-key/private.pem ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out .pangram-qwen3-key/private.pem
          fi
          openssl pkey -in .pangram-qwen3-key/private.pem -pubout -out .pangram-qwen3-key/public.pem
          echo '---PUBLIC-KEY-BEGIN---'
          cat .pangram-qwen3-key/public.pem
          echo '---PUBLIC-KEY-END---'

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h /

      - name: Install inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -q 'transformers>=4.51,<5' 'peft>=0.18' 'accelerate>=1.0' safetensors scipy emoji huggingface_hub

      - name: Decrypt essays in runner only
        if: ${{ hashFiles('pangram_qwen3_payload/key.enc.b64') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          base64 -d pangram_qwen3_payload/key.enc.b64 > "$RUNNER_TEMP/key.enc"
          openssl pkeyutl -decrypt -inkey .pangram-qwen3-key/private.pem -in "$RUNNER_TEMP/key.enc" -out "$RUNNER_TEMP/key.hex"
          for stem in essay1 essay2; do
            cat pangram_qwen3_payload/${stem}.enc.b64.part* > "$RUNNER_TEMP/${stem}.enc.b64"
            base64 -d "$RUNNER_TEMP/${stem}.enc.b64" > "$RUNNER_TEMP/${stem}.enc"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$RUNNER_TEMP/key.hex" -in "$RUNNER_TEMP/${stem}.enc" -out "$RUNNER_TEMP/${stem}.txt.gz"
            gzip -dc "$RUNNER_TEMP/${stem}.txt.gz" > "$RUNNER_TEMP/${stem}.txt"
            chmod 600 "$RUNNER_TEMP/${stem}.txt"
          done
          chmod 600 "$RUNNER_TEMP/key.hex"

      - name: Run 4B EditLens-family detector with Pangram recipe
        shell: bash
        env:
          HAVE_PAYLOAD: ${{ hashFiles('pangram_qwen3_payload/key.enc.b64') != '' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run_qwen_editlens.py" <<'PY'
          import json, math, os, re, statistics, sys
          from pathlib import Path
          import torch
          import torch.nn as nn
          import emoji
          from transformers import AutoModelForSequenceClassification, AutoTokenizer
          from peft import PeftModel

          BASE = 'Qwen/Qwen3-4B'
          ADAPTER = 'DarrenJiaImbue/editlens-qwen3-4b'
          MAX_LENGTH = 1024
          N_BUCKETS = 4
          MIN_WORDS = 75
          CHUNK_WORDS = 450
          OVERLAP_WORDS = 50

          class NormedLinear(nn.Module):
              def __init__(self, hidden_size, num_labels, device=None, dtype=None):
                  super().__init__()
                  self.norm = nn.LayerNorm(hidden_size, device=device, dtype=dtype)
                  self.linear = nn.Linear(hidden_size, num_labels, bias=False, device=device, dtype=dtype)
              def forward(self, x):
                  return self.linear(self.norm(x))

          BOILERPLATE_STARTS = ['Sure','Here','Abstract','Title',"I'm happy to help",'Certainly']
          def clean_text(text):
              text = emoji.demojize(text)
              if '</think>' in text:
                  text = text.split('</think>',1)[1].strip()
              paragraphs = [p for p in text.split('\n') if p.strip()]
              if paragraphs:
                  first = re.sub(r'^[^a-zA-Z0-9]*','',paragraphs[0])
                  first = emoji.replace_emoji(first,'')
                  if any(first.startswith(p) for p in BOILERPLATE_STARTS) and len(paragraphs)>1:
                      text='\n'.join(paragraphs[1:])
              text=text.lower()
              return re.sub(r'\s+',' ',text).strip()

          def word_chunks(text):
              words = text.split()
              out=[]
              step=CHUNK_WORDS-OVERLAP_WORDS
              for start in range(0,len(words),step):
                  end=min(len(words),start+CHUNK_WORDS)
                  if end-start < MIN_WORDS:
                      if out and end==len(words):
                          # append tail to prior chunk only if it stays reasonable; otherwise keep tail
                          pass
                      else:
                          break
                  if end-start >= MIN_WORDS:
                      out.append((start+1,end,' '.join(words[start:end])))
                  if end==len(words): break
              return out

          print('PYTORCH', torch.__version__)
          print('MODEL_BASE', BASE)
          print('MODEL_ADAPTER', ADAPTER)
          print('MAX_LENGTH', MAX_LENGTH)
          print('Loading tokenizer...', flush=True)
          tok=AutoTokenizer.from_pretrained(BASE)
          if tok.pad_token is None:
              tok.pad_token=tok.eos_token
          tok.padding_side='left'

          print('Loading Qwen3-4B bf16 base...', flush=True)
          base=AutoModelForSequenceClassification.from_pretrained(
              BASE,
              num_labels=N_BUCKETS,
              torch_dtype=torch.bfloat16,
              low_cpu_mem_usage=True,
              attn_implementation='eager',
          )
          base.config.pad_token_id=tok.pad_token_id
          if hasattr(base,'score') and isinstance(base.score,nn.Linear):
              hs=base.config.hidden_size
              dev=next(base.parameters()).device
              dtype=next(base.parameters()).dtype
              base.score=NormedLinear(hs,N_BUCKETS,device=dev,dtype=dtype)
          print('Applying EditLens Qwen adapter...', flush=True)
          model=PeftModel.from_pretrained(base,ADAPTER)
          model.eval()
          torch.set_num_threads(max(1,min(4,os.cpu_count() or 1)))

          names=['Human','Light AI edit','Heavy AI edit','AI generated']
          def score_one(text):
              t=clean_text(text)
              enc=tok(t,return_tensors='pt',truncation=True,max_length=MAX_LENGTH)
              with torch.inference_mode():
                  out=model(**enc)
                  logits=out.logits[0].float()
                  probs=torch.softmax(logits,dim=-1).cpu().tolist()
              score=sum(i*p for i,p in enumerate(probs))/(N_BUCKETS-1)
              arg=max(range(N_BUCKETS),key=lambda i:probs[i])
              return {'score':score,'bucket':arg,'bucket_name':names[arg],'probs':probs,'tokens':int(enc['input_ids'].shape[1])}

          controls={
            'gettysburg': 'Four score and seven years ago our fathers brought forth on this continent, a new nation, conceived in Liberty, and dedicated to the proposition that all men are created equal. Now we are engaged in a great civil war, testing whether that nation, or any nation so conceived and so dedicated, can long endure. We are met on a great battle-field of that war. We have come to dedicate a portion of that field, as a final resting place for those who here gave their lives that that nation might live. It is altogether fitting and proper that we should do this. But, in a larger sense, we can not dedicate—we can not consecrate—we can not hallow—this ground. The brave men, living and dead, who struggled here, have consecrated it, far above our poor power to add or detract. The world will little note, nor long remember what we say here, but it can never forget what they did here. It is for us the living, rather, to be dedicated here to the unfinished work which they who fought here have thus far so nobly advanced.',
            'ai_style': 'Artificial intelligence is transforming the way organizations approach decision-making, collaboration, and long-term planning. At its core, the technology enables teams to process large amounts of information, identify meaningful patterns, and generate useful recommendations in less time. However, successful adoption requires more than simply deploying a powerful model. Organizations must also establish clear goals, define appropriate safeguards, and create processes for human review. A thoughtful implementation begins by identifying tasks where automation can provide measurable value while preserving accountability for consequential decisions. Teams should evaluate model outputs against relevant benchmarks, document known limitations, and monitor performance over time. They should also consider how users will interact with the system, because interface design can strongly influence whether recommendations are understood as suggestions or treated as authoritative conclusions. Training and communication are equally important. Employees need to know what the system can do, where it may fail, and when to escalate a decision to a human expert. By combining technical capability with governance, transparency, and continuous evaluation, organizations can capture the benefits of artificial intelligence while reducing unnecessary risks.'
          }
          print('---CONTROL-RESULTS-BEGIN---')
          for k,v in controls.items():
              print(json.dumps({'name':k,**score_one(v)}))
          print('---CONTROL-RESULTS-END---')

          def score_document(path,label):
              raw=Path(path).read_text(encoding='utf-8')
              cleaned=clean_text(raw)
              chunks=word_chunks(cleaned)
              rows=[]
              for idx,(s,e,c) in enumerate(chunks,1):
                  r=score_one(c)
                  r.update({'chunk':idx,'start_word':s,'end_word':e})
                  rows.append(r)
                  print(f'{label} chunk {idx}/{len(chunks)} score={r["score"]:.6f} bucket={r["bucket"]}',flush=True)
              weights=[r['end_word']-r['start_word']+1 for r in rows]
              total=sum(weights)
              mean=sum(r['score']*w for r,w in zip(rows,weights))/total
              vals=[r['score'] for r in rows]
              counts={name:sum(r['bucket_name']==name for r in rows) for name in names}
              return {
                'label':label,'words':len(cleaned.split()),'chunks':len(rows),
                'chunk_words':CHUNK_WORDS,'overlap_words':OVERLAP_WORDS,'max_length':MAX_LENGTH,
                'weighted_mean_score':mean,'median_score':statistics.median(vals),
                'min_score':min(vals),'max_score':max(vals),'bucket_counts':counts,'per_chunk':rows
              }

          if os.environ.get('HAVE_PAYLOAD','').lower()=='true':
              results=[]
              for fn,label in [('essay1.txt','closed_tribunal'),('essay2.txt','liberal_defence_markets')]:
                  results.append(score_document(os.path.join(os.environ['RUNNER_TEMP'],fn),label))
              print('---EDITLENS-QWEN3-RESULT-BEGIN---')
              print(json.dumps({'model_base':BASE,'adapter':ADAPTER,'recipe':'Pangram EditLens preprocessing + 4-bucket expected-value scoring','documents':results},indent=2))
              print('---EDITLENS-QWEN3-RESULT-END---')
          else:
              print('NO_PAYLOAD_SMOKE_TEST_ONLY')
          PY
          python "$RUNNER_TEMP/run_qwen_editlens.py"

      - name: Wipe plaintext
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/essay1.txt "$RUNNER_TEMP"/essay2.txt "$RUNNER_TEMP"/essay1.txt.gz "$RUNNER_TEMP"/essay2.txt.gz "$RUNNER_TEMP"/*.enc "$RUNNER_TEMP"/*.enc.b64 "$RUNNER_TEMP"/key.hex "$RUNNER_TEMP"/run_qwen_editlens.py || true
