name: Temporary Greyscope v2 4B cross-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  greyscope_v2:
    if: ${{ github.head_ref == 'chatgpt-pangram-llama3-check-20260822' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore ephemeral encryption key
        uses: actions/cache@v4
        with:
          path: .pangram-qwen3-key
          key: pangram-qwen3-ephemeral-v1-${{ github.head_ref }}

      - name: Restore Greyscope model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: greyscope-v2-qwen35-4b-bf16-20260822-v1

      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost || true
          sudo apt-get clean || true
          python -m pip install --no-cache-dir -q 'git+https://github.com/yaoandy107/greyscope.git@e052f07b5e5bddacce41fe4d5fcc3250081385da' accelerate safetensors hf_xet protobuf scipy
          df -h /

      - name: Decrypt essays only inside runner
        shell: bash
        run: |
          set -euo pipefail
          base64 -d pangram_qwen3_payload/key.enc.b64 > "$RUNNER_TEMP/key.enc"
          openssl pkeyutl -decrypt -inkey .pangram-qwen3-key/private.pem -in "$RUNNER_TEMP/key.enc" -out "$RUNNER_TEMP/key.hex"
          for s in essay1 essay2; do
            cat pangram_qwen3_payload/${s}.enc.b64.part* > "$RUNNER_TEMP/${s}.enc.b64"
            base64 -d "$RUNNER_TEMP/${s}.enc.b64" > "$RUNNER_TEMP/${s}.enc"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass file:"$RUNNER_TEMP/key.hex" -in "$RUNNER_TEMP/${s}.enc" -out "$RUNNER_TEMP/${s}.txt.gz"
            gzip -dc "$RUNNER_TEMP/${s}.txt.gz" > "$RUNNER_TEMP/${s}.txt"
            chmod 600 "$RUNNER_TEMP/${s}.txt"
          done

      - name: Run official Greyscope v2 calibrated decoder
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run_greyscope.py" <<'PY'
          import json, os, re, statistics
          from pathlib import Path
          from greyscope.inference import detect

          TARGET_WORDS=650
          MIN_WORDS=100

          def word_count(t): return len(re.findall(r"\b\w+\b",t))

          def paragraph_chunks(text):
              paras=[p.strip() for p in re.split(r'\n\s*\n+',text) if p.strip()]
              chunks=[]; current=[]; n=0
              for p in paras:
                  pw=word_count(p)
                  if pw>TARGET_WORDS:
                      if current:
                          chunks.append(('\n\n'.join(current),n)); current=[]; n=0
                      ws=p.split()
                      for s in range(0,len(ws),TARGET_WORDS):
                          part=' '.join(ws[s:s+TARGET_WORDS]); c=word_count(part)
                          if c>=MIN_WORDS: chunks.append((part,c))
                      continue
                  if current and n+pw>TARGET_WORDS:
                      chunks.append(('\n\n'.join(current),n)); current=[p]; n=pw
                  else:
                      current.append(p); n+=pw
              if current and n>=MIN_WORDS: chunks.append(('\n\n'.join(current),n))
              return chunks

          controls={
            'gettysburg': 'Four score and seven years ago our fathers brought forth on this continent, a new nation, conceived in Liberty, and dedicated to the proposition that all men are created equal. Now we are engaged in a great civil war, testing whether that nation, or any nation so conceived and so dedicated, can long endure. We are met on a great battle-field of that war. We have come to dedicate a portion of that field, as a final resting place for those who here gave their lives that that nation might live. It is altogether fitting and proper that we should do this. But, in a larger sense, we can not dedicate—we can not consecrate—we can not hallow—this ground. The brave men, living and dead, who struggled here, have consecrated it, far above our poor power to add or detract.',
            'ai_style': 'Artificial intelligence is transforming the way organizations approach decision-making, collaboration, and long-term planning. At its core, the technology enables teams to process large amounts of information, identify meaningful patterns, and generate useful recommendations in less time. However, successful adoption requires more than simply deploying a powerful model. Organizations must also establish clear goals, define appropriate safeguards, and create processes for human review. A thoughtful implementation begins by identifying tasks where automation can provide measurable value while preserving accountability for consequential decisions. Teams should evaluate model outputs against relevant benchmarks, document known limitations, and monitor performance over time. They should also consider how users will interact with the system, because interface design can strongly influence whether recommendations are understood as suggestions or treated as authoritative conclusions.'
          }

          print('---GREYSCOPE-CONTROLS-BEGIN---',flush=True)
          for k,v in controls.items():
              print(json.dumps({'name':k,**detect(v,mode='ternary',model='bf16',device='cpu')}),flush=True)
          print('---GREYSCOPE-CONTROLS-END---',flush=True)

          def score_doc(filename,label):
              text=Path(os.environ['RUNNER_TEMP'],filename).read_text(encoding='utf-8')
              chunks=paragraph_chunks(text); rows=[]
              for i,(chunk,n) in enumerate(chunks,1):
                  r=detect(chunk,mode='ternary',model='bf16',device='cpu')
                  row={'chunk':i,'words':n,**r}; rows.append(row)
                  print(f'GREYSCOPE {label} chunk {i}/{len(chunks)} words={n} score={r["ai_involvement"]:.3f} label={r["label"]}',flush=True)
              weights=[r['words'] for r in rows]; total=sum(weights); scores=[r['ai_involvement'] for r in rows]
              labels=['human','AI-edited','AI-generated']
              return {
                'label':label,'words_scored':total,'chunks':len(rows),
                'weighted_mean_ai_involvement':sum(r['ai_involvement']*r['words'] for r in rows)/total,
                'median_ai_involvement':statistics.median(scores),
                'min_ai_involvement':min(scores),'max_ai_involvement':max(scores),
                'label_counts':{x:sum(r['label']==x for r in rows) for x in labels},
                'per_chunk':rows
              }

          out={'model':'yaoandy107/greyscope-v2-qwen3.5-4b','decoder':'official Greyscope v2 calibration.json / CORN decoder','documents':[score_doc('essay1.txt','closed_tribunal'),score_doc('essay2.txt','liberal_defence_markets')]}
          print('---GREYSCOPE-RESULT-BEGIN---'); print(json.dumps(out,indent=2)); print('---GREYSCOPE-RESULT-END---')
          PY
          python "$RUNNER_TEMP/run_greyscope.py"

      - name: Wipe plaintext
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/essay1* "$RUNNER_TEMP"/essay2* "$RUNNER_TEMP"/key.* "$RUNNER_TEMP"/run_greyscope.py || true
